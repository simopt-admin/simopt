[project]
name = "simopt-dsl"
version = "0.1.0"
description = "A declarative modeling language for simulation optimization."
readme = "README.md"
authors = [
    { name = "Cen Wang", email = "cenwang@umass.edu" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "numpy>=2.0.0",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
